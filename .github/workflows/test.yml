name: test

# Runs on every push and pull request. The integration tests are deliberately
# not here: they act on a real repository and need a token, which a pull
# request from a fork must never be handed. They are run locally, against the
# sandbox, before a release.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The repository-hygiene tests ask git about tracked files and
          # ignore rules, which a shallow clone cannot answer.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # wrangler.jsonc is gitignored because it carries one account's resource
      # ids. The worker tests still need a config to boot workerd against, and
      # the example is exactly that: the same shape with placeholder values.
      # Nothing here reaches Cloudflare, so placeholders are sufficient.
      - name: Use the example worker config
        run: cp wrangler.example.jsonc wrangler.jsonc

      - run: npm run typecheck

      - run: npm test
